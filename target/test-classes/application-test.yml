server:
  port: 0

spring:
  application:
    name: book-catalog-service

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      repositories:
        enabled: false

  cache:
    type: simple

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    com.eyebuy.bookcatalog: DEBUG
    org.hibernate.SQL: WARN
