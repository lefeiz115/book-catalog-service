server:
  port: 8080

spring:
  application:
    name: book-catalog-service

  datasource:
    url: jdbc:mysql://localhost:3306/bookcatalog?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379

springdoc:
  swagger-ui:
    enabled: true
